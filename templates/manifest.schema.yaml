# Manifest schema for llm-repro-pack packages.
#
# Every leaf in manifest.yaml is a field object:
#   value:      the value, or "unknown"
#   provenance: run_time_evidence | researcher_provided | code_declared |
#               claude_inferred | researcher_confirmed | unknown
#   source:     file path, command or "researcher input" the value came from
#   basis:      required when provenance is claude_inferred
#   note:       optional caveat
#   conflict:   true while candidates disagree and the researcher has not resolved it
#
# Keys per entry:
#   critical:     true if the field must be locked for grade A or B; false means "recommended".
#                 The skill only builds packages that reach grade A or B.
#   required_for: grade that needs the field (A means only needed for grade A).
#   when:         condition under which the field applies at all.
#   unless:       condition under which the field is not critical.
#   fix:          how the researcher can supply the value.
#
# Conditions: {field: <dotted path>, equals: X} | {field, in: [..]} | {field, gt: N} | {field, known: true}

schema_version: "1.0"

fields:
  # ---------------------------------------------------------------- study
  - path: study.run_mode
    critical: true
    fix: "Only self_run is supported: the researcher controlled the machine."
  - path: study.task_type
    critical: true
    fix: "State single_label or multi_label."
  - path: study.label_set
    critical: true
    fix: "Provide the allowed labels (prompt.yaml labels or config task.labels)."
  - path: study.run_date
    critical: true
    fix: "Provide run timestamps or logs. File times give only an approximate date."

  # ---------------------------------------------------------------- model
  - path: model.repo_id
    critical: true
    fix: "Give the exact Hugging Face repo ID of the weights."
  - path: model.revision
    critical: true
    fix: "Give the 40-character commit hash (HF cache folder snapshots/<hash>, or model_info().sha)."
  - path: model.weight_files
    critical: true
    fix: "Run collect_env.py with the weights in the local HF cache, or pass --model-path."
  - path: model.tokenizer_sha256
    critical: true
    fix: "Provide the tokenizer files from the same commit."
  - path: model.chat_template_sha256
    critical: true
    fix: "Provide tokenizer_config.json or chat_template.jinja from the same commit."
  - path: model.chat_template_source
    critical: false
  - path: model.format
    critical: true
    fix: "State original, gguf, mlx, ollama or other."
  - path: model.quantization
    critical: true
    fix: "State the quantization (none, mxfp4, Q4_K_M, awq, ...)."
  - path: model.converted_or_quantized
    critical: false
  - path: model.ollama_tag
    critical: true
    when: {field: engine.name, equals: ollama}
    fix: "Give the Ollama tag, e.g. gpt-oss:20b."
  - path: model.ollama_digest
    critical: true
    when: {field: engine.name, equals: ollama}
    fix: "Run 'ollama show --modelfile <tag>' or read /api/tags for the digest."
  - path: model.openness
    critical: true
    fix: "Confirm fully_open or open_weight."
  - path: model.license
    critical: true
    fix: "Copy the license from the model card."
  - path: model.license_restrictions
    critical: false
  - path: model.training_data_disclosed
    critical: false
  - path: model.training_data
    critical: true
    required_for: A
    when: {field: model.openness, equals: fully_open}
    fix: "Name the training datasets (pretraining, mid-training, post-training)."
  - path: model.training_data_version
    critical: true
    required_for: A
    when: {field: model.openness, equals: fully_open}
    fix: "Give dataset versions or revisions."
  - path: model.training_code_commit
    critical: true
    required_for: A
    when: {field: model.openness, equals: fully_open}
    fix: "Give the training code repository and commit."
  - path: model.checkpoint
    critical: true
    required_for: A
    when: {field: model.openness, equals: fully_open}
    fix: "Name the released checkpoint (stage and step)."
  - path: model_profile.name
    critical: false

  # ---------------------------------------------------------------- prompt
  - path: prompt.files_sha256
    critical: true
    fix: "Confirm the final prompt files."
  - path: prompt.system_prompt
    critical: true
    unless: {field: prompt.rendered_inputs_complete, equals: true}
    fix: "Point to the system prompt, or archive all rendered requests."
  - path: prompt.user_template
    critical: true
    unless: {field: prompt.rendered_inputs_complete, equals: true}
    fix: "Point to the user template with placeholders, or archive all rendered requests."
  - path: prompt.codebook
    critical: false
  - path: prompt.few_shot
    critical: false
  - path: prompt.rendered_inputs_file
    critical: true
    fix: "Provide a prompt.yaml spec or archived request payloads."
  - path: prompt.rendered_inputs_sha256
    critical: true
  - path: prompt.rendered_inputs_complete
    critical: false
  - path: prompt.chat_template_applied
    critical: false

  # ---------------------------------------------------------------- decoding
  - path: decoding.temperature
    critical: true
    fix: "Give the temperature, or state that the engine default was used."
  - path: decoding.top_p
    critical: true
    fix: "Give top_p, or state that the engine default was used."
  - path: decoding.top_k
    critical: true
    fix: "Give top_k, or state that the engine default was used."
  - path: decoding.seed
    critical: true
    when: {field: decoding.temperature, gt: 0}
    fix: "Give the random seed used for sampling."
  - path: decoding.max_tokens
    critical: true
    fix: "Give max_tokens / max_new_tokens."
  - path: decoding.batch_size
    critical: true
    fix: "Give the batch size (it changes numerics on GPUs)."
  - path: decoding.batch_invariant
    critical: true
    fix: "State whether batch-invariant or deterministic mode was on."
  - path: decoding.precision
    critical: true
    fix: "Give the dtype (bfloat16, float16, float32)."

  # ---------------------------------------------------------------- engine
  - path: engine.name
    critical: true
    fix: "Name the inference engine (transformers, vllm, ollama, mlx, llama.cpp)."
  - path: engine.version
    critical: true
    fix: "Provide pip freeze, conda export or the engine version from logs."
  - path: engine.libraries.torch
    critical: true
    when: {field: engine.name, in: [transformers, vllm]}
    fix: "Provide the torch version (pip freeze)."
  - path: engine.os
    critical: true
    fix: "Provide the OS (uname -a or platform)."
  - path: engine.python
    critical: false
  - path: engine.cuda
    critical: true
    when: {field: hardware.accelerator_vendor, equals: nvidia}
    fix: "Provide nvidia-smi output from the run machine."
  - path: engine.driver
    critical: true
    when: {field: hardware.accelerator_vendor, equals: nvidia}
    fix: "Provide nvidia-smi output from the run machine."
  - path: engine.container_image_digest
    critical: false

  # ---------------------------------------------------------------- hardware
  - path: hardware.accelerator
    critical: true
    fix: "Name the GPU or chip (nvidia-smi, system_profiler)."
  - path: hardware.accelerator_vendor
    critical: true
  - path: hardware.accelerator_memory
    critical: false
  - path: hardware.cpu
    critical: false
  - path: hardware.cloud_provider
    critical: false
  - path: hardware.instance_type
    critical: false

  # ---------------------------------------------------------------- data
  - path: data.path
    critical: true
  - path: data.sha256
    critical: true
  - path: data.id_column
    critical: true
    fix: "Name the ID column."
  - path: data.text_column
    critical: true
    fix: "Name the text column."
  - path: data.n_items
    critical: true
  - path: data.shareable
    critical: true
  - path: data.access_instructions
    critical: true
    when: {field: data.shareable, equals: false}
    fix: "Explain how later researchers can obtain the data."
  - path: data.truncation
    critical: false
    fix: "Provide a record of truncated items, or state that no truncation happened."

  # ---------------------------------------------------------------- outputs
  - path: outputs.labels
    critical: true
  - path: outputs.labels_sha256
    critical: true
  - path: outputs.id_column
    critical: true
  - path: outputs.label_column
    critical: true
  - path: outputs.label_extraction_rule
    critical: true
    fix: "State how the final label was extracted from model text."
  - path: outputs.raw_outputs
    critical: false
    fix: "Archive the raw model text, not only the final labels."
  - path: outputs.logs
    critical: false

  # ---------------------------------------------------------------- validation
  - path: validation.gold_sha256
    critical: false
    fix: "Provide a human-labeled validation set (--gold) to report accuracy, macro-F1 and agreement."
  - path: validation.accuracy
    critical: false
    when: {field: validation.gold_sha256, known: true}
  - path: validation.macro_f1
    critical: false
    when: {field: validation.gold_sha256, known: true}
  - path: validation.cohens_kappa
    critical: false
    when: {field: validation.gold_sha256, known: true}
  - path: validation.krippendorff_alpha
    critical: false
    when: {field: validation.gold_sha256, known: true}

  # ---------------------------------------------------------------- best practice (Törnberg 2024)
  # Recommended fields. They do not change the A/B grade; BEST_PRACTICES.md reports them.
  - path: study.model_choice_rationale
    critical: false
    fix: "Explain why this model was chosen (practices.yaml)."
  - path: study.models_compared
    critical: false
  - path: study.guard_rail_refusals
    critical: false
  - path: study.coding_procedure
    critical: false
    fix: "Describe the iterative coding procedure (practices.yaml)."
  - path: model.fine_tuned
    critical: false
  - path: model.fine_tuning_data
    critical: true
    when: {field: model.fine_tuned, equals: true}
    fix: "Provide the fine-tuning data (path, DOI or URL)."
  - path: model.training_cutoff
    critical: false
    fix: "Copy the training data end date from the model card."
  - path: data.time_period
    critical: false
  - path: data.language
    critical: false
  - path: validation.after_prompt_freeze
    critical: false
    when: {field: validation.gold_sha256, known: true}
  - path: validation.gold_publicly_available
    critical: false
    when: {field: validation.gold_sha256, known: true}
  - path: validation.failure_analysis
    critical: false
    when: {field: validation.gold_sha256, known: true}
  - path: ethics.consent
    critical: false
  - path: ethics.anonymization
    critical: false
  - path: ethics.data_minimization
    critical: false
  - path: ethics.storage_and_transfer
    critical: false
  - path: ethics.copyright_and_tos
    critical: false
